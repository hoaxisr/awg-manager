        type: string
      message:
        type: string
    type: object
  api.BootStatusResponse:
    properties:
      initializing:
        example: false
        type: boolean
      instanceId:
        example: a1b2c3d4e5f6
        type: string
      phase:
        example: ready
        type: string
      remainingSeconds:
        example: 0
        type: integer
    type: object
  api.BypassSetStatusData:
    properties:
      available:
        description: Available reports whether the ipset binary is present on the
          router.
        type: boolean
      conntrackAvailable:
        description: |-
          ConntrackAvailable reports whether the conntrack binary is present.
          Without it a routing change applies only to new connections (existing
          flows linger until they expire).
        type: boolean
      entryCount:
        description: |-
          EntryCount is the number of entries in the AWGM-BYPASS set after the
          last populate. Meaningful only when EntryCountOK is true.
        type: integer
      entryCountOK:
        description: |-
          EntryCountOK reports whether EntryCount is a fact. False means the
          counter could not be read — EntryCount=0 then does NOT mean «set empty».
        type: boolean
      installing:
        description: Installing is true while an opkg install started here is running.
        type: boolean
      lastError:
        description: LastError is the error message from the last failed populate,
          or empty.
        type: string
      lastPopulate:
        description: |-
          LastPopulate is the RFC3339 timestamp of the last populate run, or
          empty string when no populate has run yet.
        type: string
      missingTags:
        description: |-
          MissingTags lists the configured geoip tags that were not found in the
          .dat files during the last populate.
        items:
          type: string
        type: array
    type: object
