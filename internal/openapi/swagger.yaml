          OOM-kill).
        example: sing-box убит OOM-killer'ом
        type: string
      lastError:
        example: engine start failed
        type: string
      netfilterAvailable:
        example: true
        type: boolean
      netfilterComponentName:
        example: iptables-mod-tproxy
        type: string
      outboundAwgCount:
        example: 2
        type: integer
      outboundCompositeCount:
        example: 1
        type: integer
      policyExists:
        example: true
        type: boolean
      policyMark:
        example: "0xffffaaa"
        type: string
      policyName:
        example: awgm-router
        type: string
      policyTunIface:
        description: |-
          PolicyTunIface / PolicyTunNDMSName — kernel- и NDMS-имена policy-tun
          интерфейса. Заполнены при Enabled+Provisioned (ДО того как режим стал
          active): по NDMS-имени пользователь разрешает интерфейс в политике
          доступа. Пусто вне policy-tun и при выключенном движке.
        example: opkgtun0
        type: string
      policyTunNdmsName:
        example: OpkgTun0
        type: string
      policyTunSourcePreserve:
        description: |-
          PolicyTunSourcePreserve — применённый режим NAT сегментов (static-NAT
          вместо маскарада). Указатель: отсутствует = «неприменимо» (не policy-tun
          или движок выключен), false = «применимо и выключено».
        example: true
        type: boolean
      restartSuppressedUntil:
        description: |-
          RestartSuppressedUntil — RFC3339-время окончания паузы авто-перезапуска
          (анти crash-loop); пусто, когда авто-перезапуск не подавлен.
        example: "2026-07-06T12:34:56+03:00"
        type: string
      ruleCount:
        example: 12
        type: integer
      ruleSetCount:
        example: 4
        type: integer
      snifferEnabled:
        example: true
        type: boolean
      tproxyTargetAvailable:
        example: true
        type: boolean
      xtDscpAvailable:
        description: |-
          XtDscpAvailable reports whether iptables DSCP matching is usable
          (xt_dscp kernel module present AND iptables `-m dscp` extension works).
          The QoS-DSCP settings UI keys its "supported" badge on this field.
        example: true
        type: boolean
    type: object
