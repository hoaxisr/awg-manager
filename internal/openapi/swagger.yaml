  /singbox/config/user/apply:
    post:
      description: Валидирует черновик (кросс-слот + sing-box check) и атомарно коммитит
        pending → active. Отключённый слот включается ПОСЛЕ успешного apply (провал
        валидации оставляет слот припаркованным, старый конфиг не воскресает). В 200-ответе
        могут быть advisory-предупреждения (warnings). Применение — debounced SIGHUP;
        добавление/удаление tun-inbound вызовет полный рестарт sing-box.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.OkResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.UserConfigApplyResponse'
              type: object
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "409":
          description: no draft to apply
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.RouterStagingValidationError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Apply user config slot draft
      tags:
      - singbox-config
  /singbox/config/user/check:
    post:
      consumes:
      - application/json
      description: 'Полный пайплайн валидации (кросс-слот + `sing-box check` над tmpdir-снапшотом
        «как если бы применили») БЕЗ записи. Тело опционально: непустое — проверяем
        его; пустое — проверяем текущий черновик; ни того ни другого — 409. Это запрос-вопрос,
        поэтому логический провал — 200 {ok:false}, а не 422.'
      parameters:
      - description: полный JSON слота (опционально)
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
