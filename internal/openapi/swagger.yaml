          address); empty/omitted = all interfaces (0.0.0.0). A loopback listener
          on 127.0.0.1 is always kept regardless of this list.
        example:
        - br0
        items:
          type: string
        type: array
      port:
        description: Port to listen on (1-65535).
        example: 2222
        type: integer
    type: object
