        type: boolean
      updateAvailable:
        description: UpdateAvailable — бинарей нет либо они не те, что в пине.
        type: boolean
    type: object
  install.InstallStatusResponse:
    properties:
      data:
        $ref: '#/definitions/install.InstallStatus'
      success:
        example: true
        type: boolean
    type: object
  install.installRequest:
    properties:
      subsystem:
        type: string
    type: object
  opkg.Package:
    properties:
      description:
        type: string
      installedAt:
        type: string
      name:
        type: string
      upgradeVersion:
        type: string
      version:
        type: string
    type: object
  ports.Binding:
    properties:
      cmdline:
        description: Full command line arguments
        type: string
      exe:
        description: Binary path (e.g. "/opt/bin/wt-client")
        type: string
      inode:
        description: Socket inode
        type: integer
      ip:
        description: Local IP (e.g. "0.0.0.0", "127.0.0.1", "::")
        type: string
      isCritical:
        description: True if terminating may affect connectivity
        type: boolean
      isSelf:
        description: True if it is this awg-manager daemon
        type: boolean
      pid:
        description: Process ID
        type: integer
      port:
        description: Port number (e.g. 56013)
        type: integer
      processName:
        description: Name (e.g. "wt-client", "dropbear")
        type: string
      proto:
        description: '"tcp", "udp", "tcp6", "udp6"'
        type: string
      service:
        description: Associated init.d service (if detected)
        type: string
      state:
        description: '"LISTEN", "UNCONN", etc.'
        type: string
      user:
        description: User / UID
        type: string
    type: object
  presets.DNSEngine:
    properties:
      domains:
        items:
          type: string
        type: array
      subnets:
        items:
          type: string
        type: array
      subscriptionUrl:
        type: string
    type: object
  presets.Engines:
    properties:
      dns:
        $ref: '#/definitions/presets.DNSEngine'
      hydraroute:
        $ref: '#/definitions/presets.HydraRouteEngine'
      singbox:
        $ref: '#/definitions/presets.SingboxEngine'
    type: object
  presets.HydraRouteEngine:
    properties:
      geoTags:
        items:
          type: string
        type: array
    type: object
  presets.Origin:
    enum:
    - builtin
    - user
    type: string
    x-enum-varnames:
    - OriginBuiltin
    - OriginUser
  presets.Preset:
    properties:
      category:
        description: social|media|ai|developer|cloud|gaming|block (free string)
        type: string
      covers:
        description: preset ids included in this composite list
        items:
          type: string
        type: array
      engines:
        $ref: '#/definitions/presets.Engines'
      featured:
        type: boolean
      iconSlug:
        type: string
      id:
        type: string
      name:
        type: string
      notice:
        type: string
      origin:
        $ref: '#/definitions/presets.Origin'
      sensitive:
        type: boolean
    type: object
  presets.RuleRef:
    properties:
      tag:
        type: string
      url:
        type: string
    type: object
  presets.SingboxEngine:
    properties:
      action:
        description: tunnel|reject|direct
        type: string
      ruleSets:
        items:
          $ref: '#/definitions/presets.RuleRef'
        type: array
    type: object
  procmon.CpuCore:
    properties:
      id:
        description: '"total", "cpu0", "cpu1", etc.'
        type: string
      idle:
        description: '%'
        type: number
      iowait:
        description: '%'
        type: number
      nice:
        description: '%'
        type: number
      system:
        description: '%'
        type: number
      usage:
        description: Total non-idle %
        type: number
      user:
        description: '%'
        type: number
    type: object
  procmon.MemoryInfo:
    properties:
      available:
        type: integer
      buffers:
        type: integer
      cached:
        type: integer
      free:
        type: integer
      swapFree:
        type: integer
      swapTotal:
        type: integer
      swapUsed:
        type: integer
      total:
        type: integer
      usagePercent:
        type: number
      used:
        type: integer
    type: object
  procmon.ProcSummary:
    properties:
      running:
        type: integer
      sleeping:
        type: integer
      stopped:
        type: integer
      threads:
        type: integer
      total:
        type: integer
      zombie:
        type: integer
    type: object
  procmon.ProcessItem:
    properties:
      cmdline:
        type: string
      cpuPercent:
        type: number
      exe:
        type: string
      isCritical:
        type: boolean
      isKernel:
        type: boolean
      isSelf:
        type: boolean
      memoryPercent:
        type: number
      memoryRss:
        description: bytes
        type: integer
      memoryVsize:
        description: bytes
        type: integer
      name:
        type: string
      nice:
        type: integer
      pid:
        type: integer
      ppid:
        type: integer
      priority:
        type: integer
      service:
        type: string
      state:
        description: '"R", "S", "D", "Z", "T"'
        type: string
      threads:
        type: integer
      user:
        type: string
    type: object
  procmon.SystemSnapshot:
    properties:
      cores:
        description: index 0 is total, followed by cpu0, cpu1...
        items:
          $ref: '#/definitions/procmon.CpuCore'
        type: array
      cpuArchitecture:
        type: string
      cpuCount:
        type: integer
      cpuModel:
        type: string
      loadAvg:
        description: 1m, 5m, 15m
        items:
          type: number
        type: array
      memory:
        $ref: '#/definitions/procmon.MemoryInfo'
      processSummary:
        $ref: '#/definitions/procmon.ProcSummary'
      processes:
        items:
          $ref: '#/definitions/procmon.ProcessItem'
        type: array
      timestamp:
        type: string
      uptimeSeconds:
        type: integer
    type: object
  services.Item:
    properties:
      enabled:
        type: boolean
      logPath:
        type: string
      managed:
        type: boolean
      managedHint:
        type: string
      name:
        type: string
      running:
        type: boolean
      script:
        type: string
      statusText:
        type: string
    type: object
  subscription.RefreshResponse:
    properties:
      data:
        $ref: '#/definitions/subscription.RefreshResult'
      success:
        example: true
        type: boolean
    type: object
  subscription.RefreshResult:
    properties:
      key:
        example: wdtt-client:default
        type: string
      message:
        type: string
      payload:
        $ref: '#/definitions/wdttlink.ImportPayload'
    type: object
  wdttlink.DecodeResponse:
    properties:
      data:
        $ref: '#/definitions/wdttlink.LinkDecodeResult'
      success:
        example: true
        type: boolean
    type: object
  wdttlink.EnsureWGResponse:
    properties:
      data:
        $ref: '#/definitions/wdttlink.EnsureWGTunnelResponse'
      success:
        example: true
        type: boolean
    type: object
  wdttlink.EnsureWGTunnelResponse:
    properties:
      created:
        type: boolean
      message:
        type: string
      tunnelId:
        type: string
      tunnelName:
        type: string
    type: object
  wdttlink.ImportPayload:
    properties:
      connMode:
        type: string
      deviceId:
        type: string
      listen:
        type: string
      name:
        type: string
      password:
        type: string
      peer:
        type: string
      subUrl:
        type: string
      vkHashes:
        items:
          type: string
        type: array
      wg:
        description: optional bundled WireGuard client config
        type: string
      workers:
        type: integer
    type: object
  wdttlink.ImportResponse:
    properties:
      data:
        $ref: '#/definitions/wdttlink.ImportResult'
      success:
        example: true
        type: boolean
    type: object
  wdttlink.ImportResult:
    properties:
      key:
        example: wdtt-client:default
        type: string
      payload:
        $ref: '#/definitions/wdttlink.ImportPayload'
    type: object
  wdttlink.LinkDecodeResult:
    properties:
      profile:
        $ref: '#/definitions/wdttlink.ImportPayload'
      subscription:
        $ref: '#/definitions/wdttlink.SubscriptionPreview'
    type: object
  wdttlink.LinkRequest:
    properties:
      clientId:
        type: string
      mode:
        type: string
      mtu:
        type: integer
      "n":
        type: integer
      name:
        type: string
      password:
        type: string
      peer:
        type: string
      provider:
        type: string
      serverId:
        type: string
      streamsPerCred:
        type: integer
      transport:
        type: string
      vkHashes:
        items:
          type: string
        type: array
      wg:
        type: string
    type: object
  wdttlink.LinkResponse:
    properties:
      data:
        $ref: '#/definitions/wdttlink.LinkResult'
      success:
        example: true
        type: boolean
    type: object
  wdttlink.LinkResult:
    properties:
      clientId:
        type: string
      link:
        example: wdtt://…
        type: string
      linkQwdtt:
        example: qwdtt://…
        type: string
      peer:
        example: 1.2.3.4:56002
        type: string
    type: object
  wdttlink.SubscriptionPreview:
    properties:
      description:
        type: string
      name:
        type: string
      profiles:
        items:
          $ref: '#/definitions/wdttlink.ImportPayload'
        type: array
      subUrl:
        type: string
      trafficLimitMb:
        type: number
      trafficUsedMb:
        type: number
      updatedAt:
        type: string
    type: object
  wdttlink.linkRequestBody:
    properties:
      id:
        type: string
      link:
        type: string
      name:
        type: string
    type: object
  wdttusers.Reload:
    enum:
    - delivered
    - serverStopped
    - failed
    type: string
    x-enum-varnames:
    - ReloadDelivered
    - ReloadServerStopped
    - ReloadFailed
  wdttusers.UserEntry:
    properties:
      comment:
        type: string
      isAuto:
        description: |-
          IsAuto — абонент приехал посевом из старого wdtt.json, а не заведён в
          панели (ServerUser.Auto): единственный, кто сегодня ставит признак, —
          instancestore/seed.go. Фронт по нему подсказывает, откуда абонент взялся.
        type: boolean
      password:
        type: string
      vkHash:
        type: string
    type: object
  wdttusers.UsersStatus:
    properties:
      available:
        description: |-
          Available — passwords.json прочитан. Пусто до первого старта сервера:
          список при этом всё равно отдаётся, из записи инстанса.
        type: boolean
      reload:
        allOf:
        - $ref: '#/definitions/wdttusers.Reload'
        description: |-
          Reload — результат доставки SIGHUP для ЭТОЙ мутации. Заполняют только
          ручки, переписывающие passwords.json (добавление, удаление); у чтения и
          переименования пусто.
      users:
        items:
          $ref: '#/definitions/wdttusers.UserEntry'
        type: array
    type: object
  wdttusers.UsersStatusResponse:
    properties:
      data:
        $ref: '#/definitions/wdttusers.UsersStatus'
      success:
        example: true
        type: boolean
    type: object
info:
  contact: {}
  description: HTTP API for the AWG Manager daemon (tunnels, routing, system).
  title: AWG Manager API
  version: "1.0"
paths:
  /access-policies:
    get:
      description: 'Works on both KeeneticOS 4.x and 5.x: `ip policy` exists since
        firmware 2.12.'
      parameters:
      - description: Pass 'true' to bypass NDMS cache
        in: query
        name: refresh
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AccessPoliciesListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: List access policies
      tags:
      - access-policy
  /access-policies/assign:
    delete:
      description: Removes the policy binding for the LAN device identified by MAC.
        The device falls back to the default policy.
      parameters:
      - description: Device MAC address
        in: query
        name: mac
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Unassign device from policy
      tags:
      - access-policy
    post:
      consumes:
      - application/json
      description: Binds the LAN device identified by MAC to the named policy. Replaces
        any existing assignment.
      parameters:
      - description: Device MAC + target policy name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AssignDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Assign device to policy
      tags:
      - access-policy
  /access-policies/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Policy description
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.CreateAccessPolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AccessPolicyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Create access policy
      tags:
      - access-policy
  /access-policies/delete:
    delete:
      description: Removes the named access policy. Bound LAN devices revert to the
        default policy.
      parameters:
      - description: Policy name (e.g. Policy0)
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Delete access policy
      tags:
      - access-policy
  /access-policies/description:
    post:
      consumes:
      - application/json
      parameters:
      - description: Policy name + new description
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.SetDescriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Set access policy description
      tags:
      - access-policy
  /access-policies/devices:
    get:
      parameters:
      - description: Pass 'true' to bypass NDMS cache
        in: query
        name: refresh
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PolicyDevicesListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: List policy devices
      tags:
      - access-policy
  /access-policies/interface-up:
    post:
      consumes:
      - application/json
      parameters:
      - description: Interface name + admin up flag
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.SetInterfaceUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Set interface admin up
      tags:
      - access-policy
  /access-policies/interfaces:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PolicyInterfacesListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: List global policy interfaces
      tags:
      - access-policy
  /access-policies/permit:
    delete:
      description: Removes the named interface from the policy.
      parameters:
      - description: Policy name
        in: query
        name: name
        required: true
        type: string
      - description: Interface name
        in: query
        name: interface
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Deny interface for policy
      tags:
      - access-policy
    post:
      consumes:
      - application/json
      description: Adds the named interface to the policy at the given order (lower
        = higher priority).
      parameters:
      - description: Policy name, interface name, priority order
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.PermitInterfaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Permit interface for policy
      tags:
      - access-policy
  /access-policies/standalone:
    post:
      consumes:
      - application/json
      parameters:
      - description: Policy name + enabled flag
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.SetStandaloneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Set access policy standalone mode
      tags:
      - access-policy
  /amnezia-premium/account-info:
    post:
      consumes:
      - application/json
      parameters:
      - description: Portal session id returned by login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AmneziaPremiumAccountInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AmneziaPremiumAccountInfoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Get Amnezia Premium account info
      tags:
      - amnezia-premium
  /amnezia-premium/download-config:
    post:
      consumes:
      - application/json
      parameters:
      - description: Portal session id and country code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AmneziaPremiumDownloadConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AmneziaPremiumDownloadConfigResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Download Amnezia Premium config
      tags:
      - amnezia-premium
  /amnezia-premium/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Premium vpn:// key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AmneziaPremiumLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AmneziaPremiumLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Login to Amnezia Premium portal
      tags:
      - amnezia-premium
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates with Keenetic credentials (or, when entwareAuthEnabled,
        Entware system credentials verified locally first); sets HttpOnly session
        cookie awg_session. Every failed attempt in which credentials were checked
        (including a local Entware check while the router is unreachable) is delayed
        300ms and counted; after 5 such failures per client IP the endpoint responds
        429 for 30 seconds. Router-unavailable failures without any credential check
        are not counted.
      parameters:
      - description: Router (or Entware) login and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LoginResponseRaw'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIEnvelope'
