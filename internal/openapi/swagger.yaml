  api.ConfigSlotContentResponse:
    properties:
      content:
        description: |-
          Content — эффективное содержимое слота (pending-preferred), пустая
          строка когда слот не сконфигурирован.
        type: string
      filename:
        type: string
      hasDraft:
        type: boolean
      slot:
        type: string
      state:
        description: 'State: "active" | "disabled" | "absent" — где лежит применённый
          файл.'
        enum:
        - active
        - disabled
        - absent
        type: string
    type: object
  api.ConfigSlotInfo:
    properties:
      enabled:
        type: boolean
      filename:
        example: 20-router.json
        type: string
      hasDraft:
        type: boolean
      mtime:
        example: "2026-07-06T12:00:00Z"
        type: string
      ownership:
        description: |-
          Ownership: "system" — слот генерируется продюсером и перезаписывается
          целиком; "user" — 90-user.json, пишется только редактором.
        enum:
        - system
        - user
        type: string
      size:
        description: |-
          Size/MTime описывают «эффективное» содержимое (pending → active →
          disabled). Size 0 и пустой MTime — слот ещё не сконфигурирован.
        type: integer
      slot:
        example: router
        type: string
    type: object
