        type: boolean
    type: object
  api.Awg3RenameRequest:
    properties:
      tag:
        example: berlin
        type: string
    type: object
  api.Awg3TunnelDTO:
    properties:
      disableCookies:
        example: true
        type: boolean
      headerProtection:
        example: true
        type: boolean
      host:
        example: vpn.example.com:51820
        type: string
      id:
        example: awg3-Ab12Cd34Ef
        type: string
      keepaliveTimeout:
        example: "25"
        type: string
      maxHandshakeAttempts:
        example: "5"
        type: string
      randomTrailers:
        description: |-
          AWG 3.1 device flags, read-only like the timers above. RandomTrailers is
          not negotiated on the wire and needs 3.1 on both ends.
        example: true
        type: boolean
      rejectAfterTime:
        example: "180"
        type: string
      rekeyAfterTime:
        example: 120-150
        type: string
      rekeyTimeout:
        description: |-
          AWG3 device timers — read-only passthrough from the imported config
          (edited only in RouteBox). Strings as RouteBox emits them (may be ranges
          like "120-150"); omitted when the config carries no such field.
        example: "5"
        type: string
      tag:
        example: amsterdam
        type: string
    type: object
  api.BackupWarningDTO:
