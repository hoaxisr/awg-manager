        — there is no implicit "clear everything" since app and sing-box logs serve
        different audiences.
      parameters:
      - description: Bucket to clear
        enum:
        - app
        - singbox
        in: query
        name: bucket
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
