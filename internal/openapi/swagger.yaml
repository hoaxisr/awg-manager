  /logs:
    get:
      description: Returns log entries from the selected bucket. `bucket=app` (default)
        covers tunnel/routing/server/system events; `bucket=singbox` covers sing-box
        forwarder events isolated from app history. By default target/message are
        backend-masked; pass `sanitize=false` only when the authenticated admin UI
        explicitly reveals raw logs.
      parameters:
      - description: Bucket selector
        enum:
        - app
        - singbox
        in: query
        name: bucket
        type: string
      - collectionFormat: multi
        description: Filter by group (repeat param or comma-separated values)
        in: query
        items:
          type: string
        name: group
        type: array
      - collectionFormat: multi
        description: Filter by subgroup (repeat param or comma-separated values)
        in: query
        items:
          type: string
        name: subgroup
        type: array
      - description: Filter by level
        in: query
        name: level
        type: string
      - description: Max entries to return (default 200)
        in: query
        name: limit
        type: integer
      - description: Skip first N matching entries
        in: query
        name: offset
        type: integer
      - description: Unix seconds — return only entries strictly after this
        in: query
        name: since
        type: integer
      - description: Return backend-sanitized target/message values; default true,
          set false to reveal raw values
        in: query
        name: sanitize
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LogsResponseEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIErrorEnvelope'
      security:
      - CookieAuth: []
      summary: Get logs
      tags:
      - logs
