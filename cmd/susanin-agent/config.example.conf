# Susanin.Keenetic runtime configuration.
# Non-secret. Normally generated by `susanin setup` / install.sh.

# Egress (VPN/WireGuard tunnel) interface(s) and tunnel IPv4 address(es).
# Несколько — через запятую: включается фейловер (активен один egress, при
# падении переключаемся на следующий живой). Адреса выравниваются по индексу
# с интерфейсами (по адресу берётся source для health-проб каждого egress).
#   egress_interface=nwg0,nwg1
#   egress_address=10.8.1.1,10.8.1.2
egress_interface=nwg0
egress_address=10.8.1.1

# LAN ingress interfaces and their networks (comma-separated).
lan_interfaces=br0,br1
lan_subnets=192.168.1.0/24,10.1.30.0/24

# Routing: numeric table for VPN egress and fwmark values (32-bit).
routing_table=100
mark_test=0x10000000
mark_ok=0x20000000
mark_mask=0x30000000
ip_rule_priority_start=2000

# Polling intervals.
fast_interval=1s
soft_interval=1s
judge_interval=1s
health_interval=5s
# FAST TCP-SYN: сколько SYN без ответа нужно для детекта (1 = быстрее, больше ложных)
fast_syn_min_op=2

# Порты, для которых отключено БЫСТРОЕ автообучение (детект «одиночный SYN без
# ответа») — именно так выглядит скан-шум. Это не даёт забивать ok-кэш
# (22/23/445/554 и т.п.). «Мягкое» обучение (потоки с ответами, которые затем
# тормозят/стопорятся) по этим портам продолжает работать, веб (80/443/QUIC) —
# как обычно. Если сервис на таком порту блокируется полностью (нет ответа),
# добавьте его домен/IP/CIDR в vpn_always.txt (списки не зависят от порта) или
# уберите порт из этого списка.
learn_exclude_ports=22,23,53,135,137,138,139,445,554,1433,1723,3306,3389,5432,5900,6379,7547,9100,11211,27017

# Cache TTLs. ok_ttl=0 means "never expire" (permanent cache; still self-corrects:
# a confirmed IP that stops replying via VPN is removed by JUDGE automatically).
ok_ttl=0
ok_refresh_below=3h
# Bounded GC (like upstream Susanin v0.12): per-proto ok-cache limit, 0=off.
ok_max_entries=4096
# Гистерезис снятия из ok: сколько ПОДРЯД «сбоев» по адресу нужно, чтобы убрать
# его из VPN-кэша. Больше — меньше «мельтешения» (OK-CHURN), но медленнее
# реакция на реально умерший маршрут. 1 = снимать сразу (как раньше).
ok_evict_misses=3
test_ttl=1m
cooldown_ttl=5m
cooldown_ok_ttl=30s
watch_ttl=8s
watch_retry_below=4s

# Health probe targets and source address (through tunnel).
health_probe=1.1.1.1,8.8.8.8
health_probe_src=10.8.1.1
# Miss-debounce: сколько подряд неудачных проб подряд = туннель DOWN (5s x 4 = 20s).
health_miss_debounce=4

# Домены, которые ВСЕГДА идут через VPN (список-«принудительный»).
# Файл: по одному домену (или IPv4) на строку, '#' — комментарии. Демон
# резолвит A-записи и пиннит их IP в ok-наборы (TCP и UDP), обновляет каждые
# vpn_always_interval секунд. Изменение файла подхватывается на лету.
# Если файла нет — функция выключена. Готовый список поставляется с дистрибутивом
# (vpn_always.txt); при установке/обновлении существующий файл НЕ перезаписывается.
# Поддерживаются wildcard-строки: *.example.com — домен и все поддомены.
vpn_always_file=/opt/susanin/etc/vpn_always.txt
vpn_always_interval=300s
# Резолвер для списка (пусто = автоматически из /etc/resolv.conf):
vpn_always_dns=

# Список «всегда напрямую» (никогда через VPN): домен / IPv4 / CIDR.
# Нет файла = выключено. Существующий файл при install/update не перезаписывается.
vpn_never_file=/opt/susanin/etc/vpn_never.txt
vpn_never_interval=300s

# Diagnostics.
log_level=info
diagnostics=off

# Режим работы с носителем.
#   normal — обычный: ведём лог-файл, сохраняем состояние (раз в 5 минут),
#            делаем бэкапы/архивы.
#   soft   — минимум записей на диск (для установки Entware во внутреннюю
#            память роутера): лог в файл не пишем, бэкапы/архивы не делаем,
#            состояние сохраняем редко — раз в soft_state_interval.
# Установщик выставляет автоматически по типу носителя (/opt): flash → normal,
# внутренняя память (NAND/UBIFS/overlay) → soft.
disk_mode=normal
# Как часто сохранять состояние в режиме soft (по умолчанию 12h; 0 = никогда).
soft_state_interval=12h
